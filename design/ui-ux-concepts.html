<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maheshwari Sabha E-Directory — UI/UX Design Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Hind:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 297mm 210mm; margin: 0 }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter','Segoe UI','Nirmala UI',sans-serif;color:#1f1a17;background:#d9d4cd;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media screen{ .page{margin:20px auto;box-shadow:0 6px 30px rgba(0,0,0,.15)} }

/* ---------- document chrome ---------- */
.page{width:297mm;height:210mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#FBF8F4;padding:11mm 13mm 0 13mm;display:flex;flex-direction:column}
.page:last-child{page-break-after:auto}
.ph-head{margin-bottom:12px}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9E2A38;font-weight:700}
.ph-head h2{font-family:'Playfair Display',Georgia,serif;font-size:27px;margin:3px 0 2px;color:#2B1B14;font-weight:700}
.ph-head .sub{margin:0;font-size:12.5px;color:#6b5d52;max-width:900px;line-height:1.45}
.pbody{flex:1;min-height:0;position:relative}
.pfoot{height:9mm;display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#9a8b7f;border-top:1px solid #e8dfd4;margin-top:6px}
.stage{display:flex;gap:16px;align-items:flex-start}
.notes{font-size:11.5px;line-height:1.5;color:#3d322b}
.notes h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9E2A38;margin:0 0 6px}
.notes ul{margin:0 0 10px;padding-left:16px}
.notes li{margin-bottom:4px}
.notes .tag{display:inline-block;font-size:9.5px;font-weight:700;background:#F3E6D6;color:#7A1F2B;border-radius:4px;padding:1px 6px;margin-right:4px}
.cap{font-size:10.5px;font-weight:600;color:#6b5d52;text-align:center;margin-top:6px}
.cap b{color:#2B1B14}
.fig{display:flex;flex-direction:column;align-items:center}

/* ---------- frames ---------- */
.browser{width:1280px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(40,20,10,.22);border:1px solid #d8d0c6}
.bbar{height:38px;background:#ECE7E1;display:flex;align-items:center;gap:8px;padding:0 14px}
.bbar i{width:12px;height:12px;border-radius:50%;background:#E0574F}
.bbar i:nth-child(2){background:#E9B53B}.bbar i:nth-child(3){background:#5BB952}
.bbar .url{margin-left:18px;background:#fff;border-radius:7px;padding:5px 14px;font-size:13px;color:#555;width:420px;display:flex;align-items:center;gap:6px}
.phone{width:414px;height:868px;border-radius:58px;background:#151312;padding:12px;position:relative;box-shadow:0 18px 45px rgba(40,20,10,.28)}
.phone .in{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative}
.island{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#151312;border-radius:20px;z-index:20}
.sb{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0;font-size:15px;font-weight:600;z-index:15;color:var(--text)}
.sb.light{color:#fff}
.sb .bat{display:flex;gap:5px;align-items:center}
.sb .bat b{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;display:inline-block;position:relative}
.sb .bat b::after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#151312;opacity:.8;z-index:30}

/* ---------- themes ---------- */
.theme-a{--primary:#7A1F2B;--primary-2:#9E2A38;--accent:#E0820A;--accent-soft:#FCEBD2;--bg:#FFF8EF;--surface:#FFFFFF;--text:#2B1B14;--muted:#7D6B5F;--line:#EEDFCC;--head:'Playfair Display',Georgia,serif;--body:'Mukta','Segoe UI','Nirmala UI',sans-serif;--r:12px;--hw:700}
.theme-b{--primary:#1E3A8A;--primary-2:#2F4FB5;--accent:#F59E0B;--accent-soft:#FEF3C7;--bg:#F4F6FB;--surface:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--head:'Inter','Segoe UI',sans-serif;--body:'Inter','Noto Sans Devanagari','Segoe UI','Nirmala UI',sans-serif;--r:12px;--hw:700}
.theme-c{--primary:#B4532A;--primary-2:#C9673C;--accent:#2F6B4F;--accent-soft:#E3EFE7;--bg:#F7F1E8;--surface:#FFFDF9;--text:#2D2620;--muted:#857767;--line:#E8DDCD;--head:'Poppins','Segoe UI',sans-serif;--body:'Poppins','Hind','Segoe UI','Nirmala UI',sans-serif;--r:22px;--hw:600}

/* ---------- shared screen components ---------- */
.scr{font-family:var(--body);color:var(--text);background:var(--bg);position:relative;overflow:hidden;font-size:15px;line-height:1.4}
.scr *{box-sizing:border-box}
.ic{flex:none;vertical-align:middle}
.h{font-family:var(--head);font-weight:var(--hw)}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:11.5px} .b{font-weight:600}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .col{display:flex;flex-direction:column} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px} .px{padding-left:16px;padding-right:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border-radius:calc(var(--r) - 2px);padding:13px 18px;font-weight:600;font-size:15px;border:1.5px solid var(--primary)}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.o{background:transparent;color:var(--primary)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.full{display:flex;width:100%}
.btn.ok{background:#15803D;border-color:#15803D;color:#fff}.btn.no{background:#fff;color:#B91C1C;border-color:#FCA5A5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.ok{background:#DCFCE7;color:#166534}.warn{background:#FEF3C7;color:#92400E}.bad{background:#FEE2E2;color:#991B1B}.info{background:#E0E7FF;color:#3730A3}.mut{background:#EEF0F3;color:#475569}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:calc(var(--r) - 4px);padding:12px 14px;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
.input.ph{color:#A8A29E}
.label{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.toggle{width:44px;height:26px;border-radius:13px;background:#CBD5E1;position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:#16A34A}.toggle.on::after{left:21px}
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-family:'Inter',sans-serif}
.ph{position:relative;overflow:hidden}
.ph .motif{position:absolute;inset:0;width:100%;height:100%}
.ph>span{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.adtag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:.06em;font-weight:600;z-index:3}
.sec-t{font-family:var(--head);font-weight:var(--hw);font-size:18px;margin:18px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t a{font-size:13px;color:var(--primary);font-family:var(--body);font-weight:600}
.hdr{background:var(--primary);color:#fff;padding:58px 16px 16px;display:flex;align-items:center;gap:12px}
.hdr .t{font-family:var(--head);font-weight:var(--hw);font-size:20px}
.hdr.plain{background:var(--bg);color:var(--text)}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:86px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 0;z-index:10}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);width:70px}
.tabbar div.on{color:var(--primary);font-weight:700}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.car{position:relative;border-radius:var(--r);overflow:hidden;color:#fff}
.car .ph{position:absolute;inset:0}
.car-tx{position:absolute;left:18px;bottom:18px;right:18px}
.car-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:700}
.car-t{font-family:var(--head);font-weight:var(--hw);font-size:22px;line-height:1.15;margin:3px 0}
.car-s{font-size:13px;opacity:.92}
.dots{position:absolute;right:14px;bottom:14px;display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55)}
.dots i.on{width:20px;background:#fff}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;font-style:italic}
.qr{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.steps{display:flex;gap:6px;padding:0 16px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.otp{display:flex;gap:9px}
.otp div{width:46px;height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.otp div.f{border-color:var(--primary);border-width:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.sel td{background:var(--accent-soft)}

/* ---------- desktop navs ---------- */
.dnav{height:72px;display:flex;align-items:center;gap:28px;padding:0 36px}
.dnav nav{display:flex;gap:6px}
.dnav nav a{padding:8px 14px;border-radius:8px;font-weight:500;font-size:15px}
.lang{display:inline-flex;border:1px solid currentColor;border-radius:8px;overflow:hidden;font-size:13px;opacity:.95}
.lang span{padding:4px 9px}
.lang span.on{background:currentColor}
.lang span.on b{color:var(--primary)}
.a-border{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,#F6C26B 18px 24px,var(--accent) 24px 30px,var(--primary-2) 30px 36px)}

/* admin */
.adm{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--primary);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.side .it{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:14px;color:rgba(255,255,255,.82)}
.side .it.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.side .it .n{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:12px 12px 4px}
.amain{padding:22px 28px;overflow:hidden;background:var(--bg)}
.atop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.atop h1{font-family:var(--head);font-size:26px;margin:0;font-weight:var(--hw)}
.kpi{padding:16px 18px}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--head)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:0 6px}
.bars div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;opacity:.85}
.bars div.p{background:var(--primary)}

/* cover */
.cover{background:#7A1F2B;color:#fff;padding:0}
.cover .cv{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr}
.cover .l{padding:22mm 0 0 20mm;position:relative;z-index:2}
.cover h1{font-family:'Playfair Display',serif;font-size:48px;line-height:1.08;margin:18px 0 14px;font-weight:700}
.cover .s{font-size:15px;opacity:.9;max-width:470px;line-height:1.55}
.cover .meta{position:absolute;left:20mm;bottom:18mm;font-size:12px;opacity:.85;line-height:1.7}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:8px}
.swatch{width:58px;height:58px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.dir-card{background:#fff;border:1px solid #eadfd2;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard{background:#fff;border:1px solid #eadfd2;border-radius:12px;padding:14px 16px}
.pcard h5{margin:6px 0 4px;font-size:13.5px;color:#2B1B14}
.pcard p{margin:0;font-size:11.5px;line-height:1.5;color:#5a4d44}
.pnum{width:28px;height:28px;border-radius:8px;background:#F3E6D6;color:#7A1F2B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ia{font-size:11.5px}
.ia .node{background:#fff;border:1px solid #e3d6c7;border-radius:8px;padding:6px 10px;margin-bottom:5px}
.ia .node.root{background:#7A1F2B;color:#fff;border-color:#7A1F2B;font-weight:700}
.ia .node.sub{margin-left:14px;font-size:11px;color:#5a4d44}
.ia h5{font-size:12px;margin:0 0 8px;color:#7A1F2B;letter-spacing:.06em;text-transform:uppercase}
.gtbl{border-collapse:collapse;width:100%;font-size:11.5px;background:#fff}
.gtbl th,.gtbl td{border:1px solid #eadfd2;padding:6px 9px;text-align:left;vertical-align:top}
.gtbl th{background:#F3E6D6;color:#5a2a1f;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.slotn{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#E0820A;color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;font-family:Inter,sans-serif;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.slot{position:relative;outline:3px dashed #E0820A;outline-offset:-3px}
.slot>.slotn{position:absolute;top:-10px;left:-10px;z-index:5}
</style>
</head>

const qr=(n=25,s=150)=>{let r='';const c=s/n;let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
